name: Build CosmeticCraft

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: CosmeticCraft-Mod
          path: build/libs/*.jar
